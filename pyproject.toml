[project]
name = "pubmed2db"
version = "0.1.0"
description = "Download PubMed abstracts, load them into DuckDB, and export to JSON and Parquet."
readme = "README.md"
requires-python = ">=3.11"   # hashlib.file_digest (download.file_md5)
license = { file = "LICENSE" }
authors = [{ name = "Gaurav Vaidya", email = "gaurav@ggvaidya.com" }]
# Floors are the versions this release is built and tested against, not the
# oldest that might work: the corpus run is the thing that matters here, and
# "it resolved to something older on your machine" is not a debugging session
# anyone wants during one. Raise them together with a full `uv lock --upgrade`
# and a green suite.
dependencies = [
    # Upper bound: we call private APIs (`_extract_article`, `_ensure_urls`), so
    # any 0.0.x release can break us. Re-test before raising the ceiling.
    # 0.0.14 is the latest release, so the ceiling has not been reached yet.
    "pubmed-downloader>=0.0.14,<0.1",
    # The export is one COPY statement whose SQL leans on version-specific
    # behaviour (regexp classes, TRY_CAST, PER_THREAD_OUTPUT options), so the
    # floor tracks what the twin tests actually ran against.
    "duckdb>=1.5.5",
    "pyarrow>=25",
    "click>=8.4",
    "requests>=2.34",
    "tqdm>=4.70",
    "lxml>=6.1",
]

[project.scripts]
pubmed2db = "pubmed2db.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pubmed2db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
